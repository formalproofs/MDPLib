name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build library, docs and paper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Lean toolchain is ~3 GB extracted; caching it skips the elan
      # install and the toolchain download on every run.
      - name: Cache the Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      # Mathlib's oleans are NOT cached here: they are 6.7 GB, over GitHub's
      # 10 GB per-repo budget, and `lake exe cache get` already fetches them
      # from Mathlib's CDN. What is cached is our own build plus the packages
      # that must be compiled from source (doc-gen4 and its dependencies),
      # which is the expensive part not covered by the Mathlib cache.
      - name: Cache the Lake build
        uses: actions/cache@v4
        with:
          path: |
            .lake/build
            .lake/packages/doc-gen4
            .lake/packages/Cli
            .lake/packages/UnicodeBasic
            .lake/packages/MD4Lean
            .lake/packages/BibtexQuery
            .lake/packages/checkdecls
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            lake-${{ runner.os }}-

      - name: Build the Lean library
        uses: leanprover/lean-action@v1
        with:
          build-args: "MDPLib"

      - name: Run the VaR regression tests
        # Interpreted rather than `lake exe mdplib`: building the executable would
        # native-compile all of Mathlib. This still exercises `computeVaR` at `ℚ`,
        # which is the code a decidability/computability regression would break.
        run: lake env lean --run Main.lean < test_var.json | tee /dev/stderr | grep -q -- '0 failed'

      - name: Build the API documentation
        run: lake -R build MDPLib:docs

      - name: Build the LaTeX paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: latex

      - name: Assemble the website
        run: |
          mkdir -p _site
          cp -r .lake/build/doc _site/docs
          find _site/docs \( -name '*.trace' -o -name '*.hash' \) -delete
          cp latex/main.pdf _site/main.pdf
          cp .github/pages-index.html _site/index.html

      - name: Upload the paper as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: latex/main.pdf

      - name: Upload the GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy documentation to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
