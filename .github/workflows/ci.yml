name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build library, docs and paper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Lean toolchain is ~3 GB extracted; caching it skips the elan
      # install and the toolchain download on every run.
      - name: Cache the Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      # Mathlib's oleans are NOT cached here: they are 6.7 GB, over GitHub's
      # 10 GB per-repo budget, and `lake exe cache get` already fetches them
      # from Mathlib's CDN. What is cached is our own build plus the packages
      # that must be compiled from source (doc-gen4 and its dependencies),
      # which is the expensive part not covered by the Mathlib cache.
      - name: Cache the Lake build
        uses: actions/cache@v4
        with:
          path: |
            .lake/build
            .lake/packages/doc-gen4
            .lake/packages/Cli
            .lake/packages/UnicodeBasic
            .lake/packages/MD4Lean
            .lake/packages/BibtexQuery
            .lake/packages/checkdecls
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            lake-${{ runner.os }}-

      - name: Build the Lean library
        uses: leanprover/lean-action@v1
        with:
          build-args: "MDPLib"

      - name: Check computability, compile the binary and run it
        # Four levels: the `#guard`s in MDPLibTest.lean (run via `lake env lean`, so they
        # re-run even on a warm cache), the interpreted `test_var.json` regression suite,
        # then native compilation of the executable, then that same suite executed by the
        # compiled binary rather than the interpreter.
        #
        # The native build compiles the whole Mathlib import closure. Mathlib's build
        # directory is deliberately not cached here (see the cache step above), so this costs
        # several minutes on every run; the `.c` files themselves come from `lake exe cache
        # get`, so only the C-to-object step is repeated.
        run: ./test.sh

      - name: Build the API documentation
        run: lake -R build MDPLib:docs

      - name: Build the LaTeX paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: latex

      # latexmk only exits with a bare code 12 on failure; the actual TeX error
      # lives in main.log, which never reaches the job log otherwise.
      - name: Show the LaTeX log if the paper failed to build
        if: failure()
        run: |
          echo '::group::latex/main.log'
          cat latex/main.log || echo 'no main.log was produced'
          echo '::endgroup::'

      - name: Assemble the website
        run: |
          mkdir -p _site
          cp -r .lake/build/doc _site/docs
          find _site/docs \( -name '*.trace' -o -name '*.hash' \) -delete
          cp latex/main.pdf _site/main.pdf
          cp .github/pages-index.html _site/index.html

      - name: Upload the paper as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: latex/main.pdf

      - name: Upload the GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy documentation to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
