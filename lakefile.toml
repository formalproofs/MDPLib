name = "mdplib"
version = "0.1.0"
defaultTargets = ["mdplib"]

[[lean_lib]]
name = "MDPLib"

# Computability guards for the main definitions at ℚ; `#guard`s and plain `def`s run at
# elaboration time, so `lake build MDPLibTest` is the whole test. Kept out of `MDPLib` so it
# does not appear in the published API docs.
[[lean_lib]]
name = "MDPLibTest"

[[lean_exe]]
name = "mdplib"
root = "Main"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
rev = "main"

[[require]]
name = "mathlib"
scope = "leanprover-community"
